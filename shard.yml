name: openssl-static
version: 0.1.0
description: |
  Seamless stdlib networking (HTTP::Client + OpenSSL + sockets) from raw
  threads without a Crystal scheduler — e.g. Android sokol/egui apps, where
  every Crystal socket call from a C-created worker thread otherwise dies.
  Desktop links the system libssl/libcrypto; mobile links a static OpenSSL
  build into the app binary.

authors:
  - oleg

